<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" class="rannabanna-logo-svg" role="img" aria-label="Rannabanna Cooking Pan & Egg Logo">
  <defs>
    <!-- Pan Body Cast-Iron Gradient -->
    <linearGradient id="rbPanGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#2D323F" />
      <stop offset="45%" stop-color="#1B1E26" />
      <stop offset="100%" stop-color="#111317" />
    </linearGradient>

    <!-- Glowing Brand Rim Accent -->
    <linearGradient id="rbRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A3D" />
      <stop offset="50%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#E91E63" />
    </linearGradient>

    <!-- Pan Handle Solid Steel Gradient -->
    <linearGradient id="rbHandleGrad" x1="65%" y1="35%" x2="95%" y2="10%">
      <stop offset="0%" stop-color="#404654" />
      <stop offset="50%" stop-color="#282C37" />
      <stop offset="100%" stop-color="#181A20" />
    </linearGradient>

    <!-- Golden Egg Yolk Gradient -->
    <linearGradient id="rbYolkGrad" x1="35%" y1="30%" x2="75%" y2="85%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="35%" stop-color="#FFB703" />
      <stop offset="75%" stop-color="#FB8500" />
      <stop offset="100%" stop-color="#E63946" />
    </linearGradient>

    <!-- Ambient Sizzle Glow -->
    <radialGradient id="rbHeatGlow" cx="46%" cy="54%" r="42%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FF5722" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0" />
    </radialGradient>

    <!-- Depth Shadow for Egg White -->
    <filter id="rbEggShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Depth Shadow for Egg Yolk -->
    <filter id="rbYolkShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#7C2D12" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Ambient Sizzle Radiance -->
  <circle cx="46" cy="54" r="34" fill="url(#rbHeatGlow)" />

  <!-- Rising Culinary Steam Wisps -->
  <g class="steam-group">
    <path class="steam-wisp-1" d="M 37,23 C 35,16 41,12 38,5" stroke="#FFA726" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.85" />
    <path class="steam-wisp-2" d="M 47,20 C 49,12 45,8 48,3" stroke="#FF6B35" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.9" />
    <path class="steam-wisp-3" d="M 57,23 C 55,16 61,12 58,6" stroke="#FFCA28" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
  </g>

  <!-- Pan Handle (Pro Chef Skillet Handle with Ergonomic Hang Slot) -->
  <path d="M 68,36 L 87,17 C 89,15 92.5,16 93.5,18.5 C 94.5,21 93,24 91,26 L 72,44 Z" fill="url(#rbHandleGrad)" stroke="#16181E" stroke-width="0.8" />
  <!-- Hanging Eyelet -->
  <circle cx="88.5" cy="20.5" r="2.4" fill="#0D1117" stroke="#404654" stroke-width="0.7" />
  <!-- Handle Grip Accents -->
  <line x1="77" y1="28" x2="81" y2="32" stroke="#4A5263" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
  <!-- Handle Stamped Signature 'R' Monogram -->
  <text x="73" y="38" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="5.5" fill="#FF8C42" opacity="0.85" text-anchor="middle" transform="rotate(45, 73, 38)">R</text>

  <!-- Skillet Outer Body & Rim -->
  <circle cx="46" cy="54" r="30" fill="url(#rbPanGrad)" stroke="url(#rbRimGrad)" stroke-width="3.2" />

  <!-- Skillet Cooking Surface Base & Seasoning Depth Ring -->
  <circle cx="46" cy="54" r="25.5" fill="#14171E" stroke="#242936" stroke-width="1.2" />
  <circle cx="46" cy="54" r="21" fill="none" stroke="#FF6B35" stroke-width="0.6" stroke-dasharray="1.5 3" opacity="0.25" />

  <!-- Sizzling Egg White (Fluid, organic culinary contour with soft volume) -->
  <path d="M 33,48 C 30,54 33,63 38,68 C 44,73 54,74 61,69 C 67,64 69,55 66,48 C 63,41 53,39 46,40 C 39,41 35,43 33,48 Z" fill="#F8FAFC" filter="url(#rbEggShadow)" />
  <!-- Crispy Golden Caramelized Sizzle Contour -->
  <path d="M 34,56 C 33,62 36,67 41,70 C 47,73 56,73 62,68" stroke="#F59E0B" stroke-width="0.8" stroke-dasharray="2 1.5" stroke-linecap="round" fill="none" opacity="0.65" />

  <!-- Sizzling Egg Yolk (Plump, golden-amber sunny-side sphere) -->
  <circle cx="49" cy="53" r="10.2" fill="url(#rbYolkGrad)" filter="url(#rbYolkShadow)" />

  <!-- Yolk 3D Gloss Specular Reflection -->
  <path d="M 44,49 C 45,46 48.5,44.5 51.5,45.5 C 49.5,46.5 47.5,47.8 46.5,50.8 C 45.5,51.8 44.2,51 44,49 Z" fill="#FFFFFF" opacity="0.95" />
  <circle cx="53.5" cy="56.5" r="1.3" fill="#FFFFFF" opacity="0.45" />

  <!-- Pan Polished Edge Sparkle -->
  <path d="M 22,39 L 23.5,35 L 25,39 L 29,40.5 L 25,42 L 23.5,46 L 22,42 L 18,40.5 Z" fill="#FFFFFF" opacity="0.9" />
</svg>